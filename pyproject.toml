[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptivesolve"
version = "0.1.0"
description = "Adaptive direct/program reasoning with a bounded arithmetic interpreter and repair traces."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Divyansh Gupta"}]
dependencies = []

[project.urls]
Repository = "https://github.com/DIVYANSH-675/AdaptiveSolve"
Issues = "https://github.com/DIVYANSH-675/AdaptiveSolve/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1", "ruff>=0.9"]

[project.scripts]
adaptivesolve = "adaptivesolve.cli:main"
adaptivesolve-artifacts = "adaptivesolve.artifact_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
